version: '3.8'

services:
  # --- Isolated Mock Testing Database Server ---
  test_db:
    image: pgvector/pgvector:pg16
    container_name: legal_postgres_test
    environment:
      POSTGRES_DB: legal_vault_sandbox
      POSTGRES_USER: test_developer
      POSTGRES_PASSWORD: test_secure_password_123
    # Ports are omitted to prevent local port binding conflicts during background CI pipeline runs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_developer -d legal_vault_sandbox"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - legal_test_network

  # --- Test Runner Container Execution Instance ---
  test_worker:
    build:
      context: .
      dockerfile: worker.dockerfile
    container_name: legal_test_execution_node
    environment:
      - DATABASE_URL=postgresql://test_developer:test_secure_password_123@test_db:5432/legal_vault_sandbox
      - AWS_ACCESS_KEY=test_mock_access
      - AWS_SECRET_KEY=test_mock_secret
    depends_on:
      test_db:
        condition: service_healthy
    # Overrides production startup script to trigger the pytest verification suite instantly
    # command: ["pytest", "-v", "main.py"]
    command: tail -f /dev/null
    networks:
      - legal_test_network

networks:
  legal_test_network:
    driver: bridge